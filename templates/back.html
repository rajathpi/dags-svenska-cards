<div class="chip">{{Channel}} · {{Timestamp}}</div>
<div class="word">{{Word}}</div>
<hr id="answer">
<div class="meaning">{{English}}</div>
<div class="grammar"><span class="pos">{{POS}}</span> <span class="forms">{{Forms}}</span></div>
<div class="example">
  <div class="sv">{{Sentence}}</div>
  <div class="en">{{SentenceEnglish}}</div>
</div>
<div class="audio back-audio">{{AudioBack}}</div>
{{#Note}}<div class="note">{{Note}}</div>{{/Note}}
<a class="watch" href="{{Link}}">▶ Hear it in the video at {{Timestamp}}</a>
<div class="credit">From <a href="{{ChannelURL}}">{{Channel}}</a>, {{Video}}. Go watch and subscribe!</div>
